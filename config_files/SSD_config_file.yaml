    passives:
      - name: "Charged Surface"
        material: "Vacuum"
        charge_density:
          name: constant
          value: -1e-10 #C/mm^3
        geometry:
          tube:
            r: 
              from: 4
              to: 30
            h: 0.04
            origin: #how much to shift the, z=5 goes from -2.5 to 2.5, this would make it fo from 0, 5
              z: -0.03
    virtual_drift_volumes:
      - model: "arbitrary"
        id: 4
        geometry:
          tube:
            r: 35
            h: 0.002
            origin:
              z: 0.001
